<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dfcadaccfkyfslakbigf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UMa2mZ1Ftz9fPEAQx_b_mQ_jdWtpaLi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let products = [];
let selectedImage = "";
let editingId = null;


/* =========================
   PAGE LOAD
========================= */

document.addEventListener("DOMContentLoaded", function () {

  const imageInput =
    document.getElementById("image");

  if (imageInput) {

    imageInput.addEventListener("change", function (e) {

      const file = e.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        selectedImage =
          event.target.result;

        const preview =
          document.getElementById("preview");

        if (preview) {

          preview.src =
            selectedImage;

          preview.style.display =
            "block";
        }

      };

      reader.readAsDataURL(file);

    });

  }

  showProducts();

});



/* =========================
   ADD / UPDATE PRODUCT
========================= */

async function saveProduct() {

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value;

  const oldPrice =
    document.getElementById("oldPrice").value;

  const category =
    document.getElementById("category").value;

  const size =
    document.getElementById("size").value.trim();

  const color =
    document.getElementById("color").value.trim();

  const stock =
    document.getElementById("stock").value;

  const description =
    document.getElementById("description").value.trim();


  /* CHECK */

  if (!name) {

    alert("❌ Product name डालें");

    return;
  }


  if (!price) {

    alert("❌ Product price डालें");

    return;
  }


  /* =========================
     SUPABASE DATA

     IMPORTANT:
     ये तुम्हारी table के
     lowercase columns हैं
  ========================= */

  const productData = {

    "name": name,

    "price": Number(price),

    "old price":
      oldPrice
        ? Number(oldPrice)
        : null,

    "category": category,

    "size": size,

    "colour": color,

    "Stock":
      Number(stock || 0),

    "Image Url":
      selectedImage,

    "description":
      description

  };


  /* =========================
     UPDATE PRODUCT
  ========================= */

  if (editingId !== null) {

    const { error } = await db
      .from("Product")
      .update(productData)
      .eq("id", editingId);


    if (error) {

      console.error(error);

      alert(
        "❌ Product update नहीं हुआ:\n\n" +
        error.message
      );

      return;
    }


    alert("✅ Product updated successfully");

  }


  /* =========================
     ADD PRODUCT
  ========================= */

  else {

    const { error } = await db
      .from("Product")
      .insert([productData]);


    if (error) {

      console.error(error);

      alert(
        "❌ Product add नहीं हुआ:\n\n" +
        error.message
      );

      return;
    }


    alert("✅ Product added successfully");

  }


  clearForm();

  await showProducts();

}



/* =========================
   SHOW PRODUCTS
========================= */

async function showProducts() {

  const box =
    document.getElementById("products");


  if (!box) {

    console.error(
      "products element नहीं मिला"
    );

    return;
  }


  box.innerHTML =
    '<div class="empty">Loading...</div>';


  const { data, error } =
    await db
      .from("Product")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    box.innerHTML =
      '<div class="empty">❌ Products load नहीं हुए</div>';

    alert(
      "❌ Database error:\n\n" +
      error.message
    );

    return;
  }


  products =
    data || [];


  const count =
    document.getElementById("count");


  if (count) {

    count.textContent =
      products.length;

  }


  if (products.length === 0) {

    box.innerHTML =
      '<div class="empty">📦 अभी कोई product नहीं है</div>';

    return;
  }


  box.innerHTML = "";


  products.forEach(function (product) {

    const div =
      document.createElement("div");


    div.className =
      "product";


    const image =
      product["Image Url"] ||
      "https://via.placeholder.com/150";


    div.innerHTML = `

      <img
        src="${image}"
        alt="Product"
      >

      <div class="product-info">

        <h3>
          ${escapeHtml(product.name)}
        </h3>


        <div class="price">

          ₹${product.price}

          ${
            product["old price"]
              ? `
                <span class="old">
                  ₹${product["old price"]}
                </span>
              `
              : ""
          }

        </div>


        <small>

          ${escapeHtml(
            product.category || ""
          )}

          • Stock:
          ${product.Stock || 0}

        </small>


        <div class="actions">

          <button
            class="edit"
            onclick="editProduct(${product.id})"
          >
            ✏️ Edit
          </button>


          <button
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    `;


    box.appendChild(div);

  });

}



/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

  const product =
    products.find(
      function (p) {
        return p.id === id;
      }
    );


  if (!product) return;


  editingId =
    id;


  document.getElementById("name").value =
    product.name || "";


  document.getElementById("price").value =
    product.price || "";


  document.getElementById("oldPrice").value =
    product["old price"] || "";


  document.getElementById("category").value =
    product.category || "";


  document.getElementById("size").value =
    product.size || "";


  document.getElementById("color").value =
    product.colour || "";


  document.getElementById("stock").value =
    product.Stock || 0;


  document.getElementById("description").value =
    product.description || "";


  selectedImage =
    product["Image Url"] || "";


  if (selectedImage) {

    const preview =
      document.getElementById("preview");


    if (preview) {

      preview.src =
        selectedImage;

      preview.style.display =
        "block";

    }

  }


  const formTitle =
    document.getElementById("formTitle");


  if (formTitle) {

    formTitle.textContent =
      "✏️ Edit Product";

  }


  const saveButton =
    document.getElementById("saveButton");


  if (saveButton) {

    saveButton.textContent =
      "💾 Update Product";

  }


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}



/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  const confirmDelete =
    confirm(
      "क्या आप यह product delete करना चाहते हैं?"
    );


  if (!confirmDelete) {

    return;

  }


  const { error } =
    await db
      .from("Product")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "❌ Product delete नहीं हुआ:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "🗑️ Product deleted"
  );


  await showProducts();

}



/* =========================
   CLEAR FORM
========================= */

function clearForm() {

  editingId =
    null;


  selectedImage =
    "";


  document.getElementById("name").value =
    "";


  document.getElementById("price").value =
    "";


  document.getElementById("oldPrice").value =
    "";


  document.getElementById("category").value =
    "";


  document.getElementById("size").value =
    "";


  document.getElementById("color").value =
    "";


  document.getElementById("stock").value =
    "1";


  document.getElementById("description").value =
    "";


  const image =
    document.getElementById("image");


  if (image) {

    image.value =
      "";

  }


  const preview =
    document.getElementById("preview");


  if (preview) {

    preview.src =
      "";

    preview.style.display =
      "none";

  }


  const formTitle =
    document.getElementById("formTitle");


  if (formTitle) {

    formTitle.textContent =
      "➕ Add Product";

  }


  const saveButton =
    document.getElementById("saveButton");


  if (saveButton) {

    saveButton.textContent =
      "➕ Add Product";

  }

}



/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================
   BUTTON FUNCTIONS
========================= */

window.saveProduct =
  saveProduct;


window.editProduct =
  editProduct;


window.deleteProduct =
  deleteProduct;


window.clearForm =
  clearForm;


</script>
