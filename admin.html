<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VR SHOP Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

header h1{
  font-size:24px;
}

.products-count{
  font-size:16px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 3px 15px #0001;
}

h2{
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.image-box{
  border:2px dashed #bbb;
  border-radius:15px;
  padding:20px;
  text-align:center;
  margin-top:10px;
}

.image-box input{
  border:0;
  padding:10px;
}

#preview{
  display:none;
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:15px;
  margin:15px auto;
}

button{
  border:0;
  padding:13px 20px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  width:100%;
  background:#111;
  color:white;
  margin-top:20px;
}

.clear-btn{
  background:#eee;
  color:#111;
  margin-top:10px;
  width:100%;
}

.product{
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  background:#eee;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin-bottom:6px;
}

.price{
  font-weight:bold;
  font-size:18px;
}

.old{
  text-decoration:line-through;
  color:#888;
  margin-left:5px;
  font-size:14px;
}

.actions{
  margin-top:10px;
  display:flex;
  gap:8px;
}

.edit{
  background:#eee;
}

.delete{
  background:#111;
  color:white;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

@media(max-width:600px){

  header h1{
    font-size:20px;
  }

  .container{
    padding:12px;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:75px;
    height:75px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ VR SHOP Admin</h1>
  <div class="products-count">
    <span id="count">0</span> products
  </div>
</header>


<div class="container">

<div class="card">

<h2 id="formTitle">➕ Add Product</h2>

<label>Product Name</label>
<input
  type="text"
  id="name"
  placeholder="Men t shirt"
>

<label>Price (₹)</label>
<input
  type="number"
  id="price"
  placeholder="400"
>

<label>Old Price (₹)</label>
<input
  type="number"
  id="oldPrice"
  placeholder="699"
>

<label>Category</label>
<select id="category">

<option value="Men">Men</option>
<option value="Women">Women</option>
<option value="Kids">Kids</option>
<option value="Shoes">Shoes</option>
<option value="Accessories">Accessories</option>
<option value="Other">Other</option>

</select>

<label>Size</label>
<input
  type="text"
  id="size"
  placeholder="M, L, XL"
>

<label>Color</label>
<input
  type="text"
  id="color"
  placeholder="White"
>

<label>Stock</label>
<input
  type="number"
  id="stock"
  placeholder="10"
  value="1"
>

<label>📷 Product Image</label>

<div class="image-box">

<p>Gallery से product की photo चुनें</p>

<input
  type="file"
  id="image"
  accept="image/*"
>

<img id="preview">

</div>

<label>Description</label>

<textarea
  id="description"
  placeholder="Product details..."
></textarea>

<button
  class="add-btn"
  onclick="saveProduct()"
  id="saveButton"
>
➕ Add Product
</button>

<button
  class="clear-btn"
  onclick="clearForm()"
>
Clear Form
</button>

</div>


<div class="card">

<h2>📦 Your Products</h2>

<div id="products"></div>

</div>

</div>


<script>

let products = JSON.parse(
  localStorage.getItem("vrshop_products") || "[]"
);

let selectedImage = "";

let editingId = null;


/* IMAGE SELECT */

document
.getElementById("image")
.addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    selectedImage = event.target.result;

    const preview =
      document.getElementById("preview");

    preview.src = selectedImage;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* SAVE PRODUCT */

function saveProduct(){

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value;

  const oldPrice =
    document.getElementById("oldPrice").value;

  const category =
    document.getElementById("category").value;

  const size =
    document.getElementById("size").value.trim();

  const color =
    document.getElementById("color").value.trim();

  const stock =
    document.getElementById("stock").value;

  const description =
    document.getElementById("description").value.trim();


  if(!name){

    alert("Product name डालें");

    return;
  }

  if(!price){

    alert("Product price डालें");

    return;
  }


  if(editingId){

    const index =
      products.findIndex(
        p => p.id === editingId
      );

    if(index !== -1){

      products[index] = {

        ...products[index],

        name:name,
        price:price,
        oldPrice:oldPrice,
        category:category,
        size:size,
        color:color,
        stock:stock,
        description:description,

        image:
          selectedImage ||
          products[index].image

      };

    }

    alert("✅ Product updated");

  }else{

    const product = {

      id:Date.now(),

      name:name,

      price:price,

      oldPrice:oldPrice,

      category:category,

      size:size,

      color:color,

      stock:stock,

      image:selectedImage,

      description:description

    };

    products.push(product);

    alert("✅ Product added");

  }


  localStorage.setItem(
    "vrshop_products",
    JSON.stringify(products)
  );


  clearForm();

  showProducts();

}


/* SHOW PRODUCTS */

function showProducts(){

  const box =
    document.getElementById("products");

  document.getElementById("count")
    .textContent = products.length;


  if(products.length === 0){

    box.innerHTML =
      '<div class="empty">अभी कोई product नहीं है</div>';

    return;
  }


  box.innerHTML = "";


  products
  .slice()
  .reverse()
  .forEach(product => {

    const div =
      document.createElement("div");

    div.className = "product";


    const image =
      product.image ||
      "https://via.placeholder.com/150";


    div.innerHTML = `

      <img src="${image}">

      <div class="product-info">

        <h3>${escapeHtml(product.name)}</h3>

        <div class="price">

          ₹${product.price}

          ${
            product.oldPrice
            ? `<span class="old">
                ₹${product.oldPrice}
               </span>`
            : ""
          }

        </div>

        <small>
          ${escapeHtml(product.category)}
          • Stock: ${product.stock}
        </small>

        <div class="actions">

          <button
            class="edit"
            onclick="editProduct(${product.id})"
          >
            ✏️ Edit
          </button>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    `;


    box.appendChild(div);

  });

}


/* EDIT */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;


  editingId = id;


  document.getElementById("name").value =
    product.name;

  document.getElementById("price").value =
    product.price;

  document.getElementById("oldPrice").value =
    product.oldPrice || "";

  document.getElementById("category").value =
    product.category;

  document.getElementById("size").value =
    product.size || "";

  document.getElementById("color").value =
    product.color || "";

  document.getElementById("stock").value =
    product.stock;

  document.getElementById("description").value =
    product.description || "";


  selectedImage =
    product.image || "";


  if(selectedImage){

    document.getElementById("preview").src =
      selectedImage;

    document.getElementById("preview").style.display =
      "block";

  }


  document.getElementById("formTitle")
    .textContent = "✏️ Edit Product";

  document.getElementById("saveButton")
    .textContent = "💾 Update Product";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE */

function deleteProduct(id){

  if(!confirm("क्या आप यह product delete करना चाहते हैं?")){

    return;
  }


  products =
    products.filter(
      p => p.id !== id
    );


  localStorage.setItem(
    "vrshop_products",
    JSON.stringify(products)
  );


  showProducts();

}


/* CLEAR FORM */

function clearForm(){

  editingId = null;

  selectedImage = "";


  document.getElementById("name").value = "";

  document.getElementById("price").value = "";

  document.getElementById("oldPrice").value = "";

  document.getElementById("category").value = "Men";

  document.getElementById("size").value = "";

  document.getElementById("color").value = "";

  document.getElementById("stock").value = "1";

  document.getElementById("description").value = "";

  document.getElementById("image").value = "";


  document.getElementById("preview").style.display =
    "none";


  document.getElementById("formTitle")
    .textContent = "➕ Add Product";

  document.getElementById("saveButton")
    .textContent = "➕ Add Product";

}


/* SECURITY */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

showProducts();

</script>

</body>
</html>
