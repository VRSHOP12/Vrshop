<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VR SHOP | Fashion Store</title>

  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="google-site-verification"
        content="hMBWFJzV99LEfmYQXigYxbgNdVQE-wnqQkmdLVsV7Ks">

  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/png" href="logo.png">


  <!-- =========================
       CSS START
  ========================== -->

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .top {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 8px;
      font-size: 13px;
    }

    nav {
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px #0002;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 15px;
      outline: none;
    }

    .search input:focus {
      border-color: #111;
    }

    .cart {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 65px 35px;
      border-radius: 22px;
      background: linear-gradient(120deg, #111, #555);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 25px;
    }

    .shop {
      border: 0;
      background: white;
      padding: 14px 25px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero-icon {
      font-size: 120px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 20px;
    }

    .categories button {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 18px;
      border-radius: 25px;
      white-space: nowrap;
      cursor: pointer;
    }

    .categories button:hover {
      background: #111;
      color: white;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .filters select {
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(210px, 1fr)
      );
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
    }

    .product-img {
      height: 250px;
      background: linear-gradient(135deg, #eee, #ddd);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
      overflow: hidden;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin-bottom: 7px;
    }

    .category {
      color: #777;
      font-size: 13px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-top: 10px;
    }

    .old {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-left: 7px;
    }

    .add {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .add:hover {
      background: #333;
    }

    .deal {
      background: white;
      margin: 35px 0;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 35px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000b;
      z-index: 200;
      padding: 10px;
    }

    .modal {
      background: white;
      width: 95%;
      max-width: 600px;
      max-height: 90vh;
      overflow: auto;
      margin: 4vh auto;
      padding: 25px;
      border-radius: 20px;
    }

    .close {
      float: right;
      border: 0;
      background: #eee;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .field {
      margin: 12px 0;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .location {
      background: #f1f1f1;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 10px;
    }

    .order {
      width: 100%;
      background: #111;
      color: white;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .order:hover {
      background: #333;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin: 18px 0;
    }

    @media (max-width: 650px) {

      .nav {
        flex-wrap: wrap;
        padding: 10px;
      }

      .logo img {
        width: 60px;
        height: 60px;
      }

      .search {
        order: 3;
        flex-basis: 100%;
      }

      .hero {
        margin: 12px;
        padding: 40px 20px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 15px;
      }

      .hero-icon {
        font-size: 70px;
      }

      .container {
        padding: 12px;
      }

      .products {
        grid-template-columns: repeat(
          2,
          minmax(0, 1fr)
        );
        gap: 12px;
      }

      .product-img {
        height: 200px;
      }

      .info {
        padding: 12px;
      }

      .info h3 {
        font-size: 15px;
      }

      .price {
        font-size: 18px;
      }

      .row {
        grid-template-columns: 1fr;
      }

    }

  </style>

  <!-- =========================
       CSS END
  ========================== -->


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("./sw.js")
          .then(function () {
            console.log("Service Worker registered");
          })
          .catch(function (error) {
            console.error(

      });

    }

  </script>

</head>


<body>


  <!-- TOP BAR -->

  <div class="top">
    🚚 VR SHOP • Local Delivery Available • WhatsApp Ordering
  </div>


  <!-- NAVIGATION -->

  <nav>

    <div class="nav">

      <div class="logo">

        <img
          src="logo.png"
          alt="VR SHOP Logo"
        >

      </div>


      <div class="search">

        <input
          id="search"
          type="text"
          placeholder="Search clothes..."
          oninput="showProducts()"
        >

      </div>


      <button
        class="cart"
        onclick="openCart()"
      >

        🛒 Cart
        (<span id="cartCount">0</span>)

      </button>

    </div>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <div>

      <h1>
        Style That Fits You
      </h1>

      <p>
        New Fashion • Great Prices • Local Delivery
      </p>

      <button
        class="shop"
        onclick="
          document
          .getElementById('shop')
          .scrollIntoView({
            behavior:'smooth'
          })
        "
      >

        Shop Now

      </button>

    </div>


    <div class="hero-icon">
      👕
    </div>

  </section>


  <!-- SHOP -->

  <main
    class="container"
    id="shop"
  >


    <!-- CATEGORIES -->

    <div class="categories">

      <button
        onclick="selectCategory('All')"
      >
        All
      </button>

      <button
        onclick="selectCategory('Men')"
      >
        Men
      </button>

      <button
        onclick="selectCategory('Women')"
      >
        Women
      </button>

      <button
        onclick="selectCategory('Kids')"
      >
        Kids
      </button>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <select
        id="category"
        onchange="showProducts()"
      >

        <option value="All">
          All Categories
        </option>

        <option value="Men">
          Men
        </option>

        <option value="Women">
          Women
        </option>

        <option value="Kids">
          Kids
        </option>

      </select>


      <select id="deliveryRadius">

        <option value="5">
          Delivery 5 KM
        </option>

        <option value="10">
          Delivery 10 KM
        </option>

        <option value="20">
          Delivery 20 KM
        </option>

        <option value="50">
          Delivery 50 KM
        </option>

      </select>

    </div>


    <!-- PRODUCTS -->

    <div
      class="products"
      id="products"
    >
    </div>


    <!-- DEAL -->

    <div class="deal">

      <h2>
        🔥 Today's Deals
      </h2>

      <br>

      <p>
        Fresh fashion at affordable prices.
      </p>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    © 2026 VR SHOP

    <br><br>

    Your Local Fashion Store

  </footer>


  <!-- =========================
       CART POPUP
  ========================== -->

  <div
    class="overlay"
    id="cartPopup"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>

      <h2>
        🛒 Your Cart
      </h2>

      <br>

      <div id="cartItems">
      </div>

      <div
        class="total"

      >
      </div>

      <button
        class="order"
        onclick="openOrder()"
      >

        Proceed to Order

      </button>

  </div>


  <!-- =========================
       ORDER POPUP
  ========================== -->

  <div
    class="overlay"
    id="orderPopup"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeOrder()"
      >
        ×
      </button>

      <h2>
        📦 Place Your Order
      </h2>

      <br>

      <div id="orderSummary">
      </div>


      <!-- NAME -->

      <div class="field">

        <input
          id="customerName"

        >

      </div>


      <!-- PHONE + PIN -->

      <div class="row">

        <div class="field">

          <input
            id="customerPhone"
            placeholder="10 Digit Mobile Number"
            inputmode="numeric"
            maxlength="10"
          >

        </div>


        <div class="field">

          <input

        ></textarea>

      </div>


      <!-- DISTANCE -->

        <select id="customerDistance">

          <option value="5">

          <option value="10">
            Within 10 KM

          <option value="20">
            Within 20 KM
          </option>

          </option>

        </select>

      <!-- LOCATION -->

      <button
        class="order"
        onclick="getLocation()"

        📍 Share Current Location

      </button>


      <div

        id="locationStatus"
      >

        Location not shared yet.

      </div>


      <!-- WHATSAPP -->

      <button
        class="order"
        onclick="sendWhatsAppOrder()"
      >

        💬 Send Order on WhatsApp

      </button>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE
    ========================== */

    const SUPABASE_URL =
      "https://dfcadaccfkyfslakbigf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UMa2mZ1Ftz9fPEAQx_b_mQ_jdWtpaLi";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       OWNER SETTINGS
    ========================== */

    const OWNER_SETTINGS = {

      whatsappNumber:
        "918099839245",

      shopName:
        "VR SHOP"

    };


    /* =========================
       PRODUCTS
    ========================== */

    let products = [];


    async function loadProductsFromSupabase() {

      const container =
        document.getElementById("products");


      if (container) {

        container.innerHTML =
          "<p style='padding:20px'>Loading products...</p>";

      }


      const { data, error } =
        await db
          .from("Product")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Supabase product error:",
          error
        );


        if (container) {

          container.innerHTML =
            "<p style='padding:20px;color:#c00'>" +
            "Products load नहीं हुए. Please refresh." +
            "</p>";

        }

        return;

      }


      products =
        (data || []).map(function (product) {

          return {

            id: product.id,

            name:
              product.name ||
              "Product",

            category:
              product.category ||
              "All",

            price:
              Number(product.price) ||
              0,

            oldPrice:
              Number(product.old_price) ||
              0,

            icon:
              "👕",

            image_url:
              product.image_url ||
              ""

          };

        });


      showProducts();

    }


    /* =========================
       CART
    ========================== */

    let cart = [];

    let customerLocation = null;


    /* =========================
       SHOW PRODUCTS
    ========================== */

    function showProducts() {

      const searchInput =
        document.getElementById("search");

      const categoryInput =
        document.getElementById("category");

      const container =
        document.getElementById("products");


      const search =
        searchInput
          ? searchInput.value
              .toLowerCase()
              .trim()
          : "";


      const category =
        categoryInput
          ? categoryInput.value
          : "All";


      const filtered =
        products.filter(function (product) {

          return (

            (
              category === "All" ||
              product.category === category
            )

            &&

            product.name
              .toLowerCase()
              .includes(search)

          );

        });


      container.innerHTML = "";


      if (filtered.length === 0) {

        container.innerHTML =
          "<p style='padding:20px'>" +
          "No products found." +
          "</p>";

        return;

      }


      filtered.forEach(function (product) {

        container.innerHTML += `

          <div class="product">

            <div class="product-img">

              ${
                product.image_url

                ?

                `
                <img
                  src="${product.image_url}"
                  alt="${product.name}"
                >
                `

                :

                product.icon
              }

            </div>


            <div class="info">

              <h3>
                ${product.name}
              </h3>


              <div class="category">
                ${product.category}
              </div>


              <div class="price">

                ₹${product.price}

                ${
                  product.oldPrice > 0

                  ?

                  `
                  <span class="old">
                    ₹${product.oldPrice}
                  </span>
                  `

                  :

                  ""
                }

              </div>


              <button
                class="add"
                onclick="addToCart(${product.id})"
              >

                Add to Cart

              </button>

            </div>

          </div>

        `;

      });

    }


    /* =========================
       CATEGORY
    ========================== */

    function selectCategory(category) {

      document.getElementById(
        "category"
      ).value = category;

      showProducts();

    }


    /* =========================
       ADD TO CART
    ========================== */

    function addToCart(id) {

      const existing =
        cart.find(function (item) {

          return item.id === id;

        });


      if (existing) {

        existing.quantity++;

      } else {

        cart.push({

          id: id,

          quantity: 1

        });

      }


      updateCartCount();


      alert(
        "Product added to cart ✅"
      );

    }


    /* =========================
       CART COUNT
    ========================== */

    function updateCartCount() {

      const count =
        cart.reduce(
          function (total, item) {

            return total +
              item.quantity;

          },
          0
        );


      document.getElementById(
        "cartCount"
      ).innerText = count;

    }


    /* =========================
       OPEN CART
    ========================== */

    function openCart() {

      document.getElementById(
        "cartPopup"
      ).style.display = "block";


      showCart();

    }


    function closeCart() {

      document.getElementById(
        "cartPopup"
      ).style.display = "none";

    }


    /* =========================
       SHOW CART
    ========================== */

    function showCart() {

      const container =
        document.getElementById(
          "cartItems"
        );


      if (cart.length === 0) {

        container.innerHTML =
          "<p>Your cart is empty.</p>";


        document.getElementById(
          "cartTotal"
        ).innerText = "";


        return;

      }


      let total = 0;


      container.innerHTML = "";


      cart.forEach(function (item) {

        const product =
          products.find(function (p) {

            return p.id === item.id;

          });


        if (!product) return;


        const itemTotal =
          product.price *
          item.quantity;


        total += itemTotal;


        container.innerHTML += `

          <div
            style="
              padding:12px 0;
              border-bottom:1px solid #ddd;
            "
          >

            <b>
              ${product.name}
            </b>

            <br>

            ₹${product.price}
            ×
            ${item.quantity}
            =
            ₹${itemTotal}

            <br><br>

            <button
              onclick="removeFromCart(${product.id})"
            >
              Remove
            </button>

          </div>

        `;

      });


      document.getElementById(
        "cartTotal"
      ).innerText =
        "Total: ₹" + total;

    }


    /* =========================
       REMOVE
    ========================== */

    function removeFromCart(id) {

      cart =
        cart.filter(function (item) {

          return item.id !== id;

        });


      updateCartCount();

      showCart();

    }


    /* =========================
       OPEN ORDER
    ========================== */

    function openOrder() {

      if (cart.length === 0) {

        alert(
          "Your cart is empty."
        );

        return;

      }


      closeCart();


      document.getElementById(
        "orderPopup"
      ).style.display = "block";


      document.getElementById(
        "customerDistance"
      ).value =
        document.getElementById(
          "deliveryRadius"
        ).value;


      let total = 0;


      cart.forEach(function (item) {

        const product =
          products.find(function (p) {

            return p.id === item.id;

          });


        if (!product) return;


        total +=
          product.price *
          item.quantity;

      });


      document.getElementById(
        "orderSummary"
      ).innerHTML =
        "<b>Order Total: ₹" +
        total +
        "</b>";

    }


    function closeOrder() {

      document.getElementById(
        "orderPopup"
      ).style.display = "none";

    }


    /* =========================
       LOCATION
    ========================== */

    function getLocation() {

      if (!navigator.geolocation) {

        alert(
          "GPS is not supported."
        );

        return;

      }


      document.getElementById(
        "locationStatus"
      ).innerText =
        "Requesting location permission...";


      navigator.geolocation.getCurrentPosition(

        function (position) {

          customerLocation = {

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude

          };


          document.getElementById(
            "locationStatus"
          ).innerHTML =

            "✅ Location captured<br>" +

            "Latitude: " +

            customerLocation
              .latitude
              .toFixed(6) +

            "<br>Longitude: " +

            customerLocation
              .longitude
              .toFixed(6);

        },


        function () {

          document.getElementById(
            "locationStatus"
          ).innerText =
            "❌ Location permission denied.";

        },


        {

          enableHighAccuracy: true

        }

      );

    }


    /* =========================
       WHATSAPP ORDER
    ========================== */

        return;

      }

        alert(

        );

        return;

      }

          products.find(function (p) {

          });

          item.quantity;


        total += itemTotal;


        items +=

          product.name +

          " × " +

          " = ₹" +

          itemTotal +

          "\n";

      });


      const mapLink =

        "https://maps.google.com/?q=" +

        customerLocation.latitude +

        "," +

        customerLocation.longitude;


      const message =
