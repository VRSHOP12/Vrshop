<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR SHOP | Fashion Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.top{
  background:#111;
  color:#fff;
  text-align:center;
  padding:8px;
  font-size:13px;
}

nav{
  background:#fff;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 10px #0002;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:13px 18px;
  border:1px solid #ddd;
  border-radius:30px;
  font-size:15px;
}

.cart{
  background:#111;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
}

.hero{
  max-width:1200px;
  margin:25px auto;
  padding:65px 35px;
  border-radius:22px;
  background:linear-gradient(120deg,#111,#555);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.hero h1{
  font-size:50px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  color:#ddd;
  margin-bottom:25px;
}

.shop{
  border:0;
  background:white;
  padding:14px 25px;
  border-radius:30px;
  font-weight:bold;
}

.hero-icon{
  font-size:120px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding-bottom:20px;
}

.categories button{
  border:1px solid #ddd;
  background:white;
  padding:10px 18px;
  border-radius:25px;
  white-space:nowrap;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.filters select{
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 15px #0001;
}

.product-img{
  height:250px;
  background:linear-gradient(135deg,#eee,#ddd);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:80px;
}

.info{
  padding:15px;
}

.info h3{
  margin-bottom:7px;
}

.category{
  color:#777;
  font-size:13px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-top:10px;
}

.old{
  color:#999;
  text-decoration:line-through;
  font-size:13px;
  margin-left:7px;
}

.add{
  width:100%;
  padding:12px;
  margin-top:12px;
  background:#111;
  color:white;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

.deal{
  background:white;
  margin:35px 0;
  padding:30px;
  border-radius:18px;
  text-align:center;
}

footer{
  background:#111;
  color:#aaa;
  text-align:center;
  padding:35px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:200;
}

.modal{
  background:white;
  width:95%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  margin:4vh auto;
  padding:25px;
  border-radius:20px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  width:32px;
  height:32px;
  border-radius:50%;
}

.field{
  margin:12px 0;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.location{
  background:#f1f1f1;
  padding:12px;
  border-radius:10px;
  font-size:13px;
}

.order{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:18px 0;
}

@media(max-width:650px){

  .nav{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    margin:12px;
    padding:40px 20px;
  }

  .hero h1{
    font-size:36px;
  }

  .hero-icon{
    font-size:70px;
  }

  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="top">
🚚 VR SHOP • Local Delivery Available • WhatsApp Ordering
</div>

<nav>
<div class="nav">

<div class="logo">
VR SHOP
</div>

<div class="search">
<input
id="search"
placeholder="Search clothes..."
oninput="showProducts()">
</div>

<button class="cart" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>
</nav>


<section class="hero">

<div>

<h1>
Style That Fits You
</h1>

<p>
New Fashion • Great Prices • Local Delivery
</p>

<button
class="shop"
onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">

Shop Now

</button>

</div>

<div class="hero-icon">
👕
</div>

</section>


<main class="container" id="shop">

<div class="categories">

<button onclick="selectCategory('All')">
All
</button>

<button onclick="selectCategory('Men')">
Men
</button>

<button onclick="selectCategory('Women')">
Women
</button>

<button onclick="selectCategory('Kids')">
Kids
</button>

</div>


<div class="filters">

<select id="category" onchange="showProducts()">

<option value="All">All Categories</option>

<option value="Men">Men</option>

<option value="Women">Women</option>

<option value="Kids">Kids</option>

</select>


<select id="deliveryRadius">

<option value="5">Delivery 5 KM</option>

<option value="10">Delivery 10 KM</option>

<option value="20">Delivery 20 KM</option>

<option value="50">Delivery 50 KM</option>

</select>

</div>


<div
class="products"
id="products">
</div>


<div class="deal">

<h2>🔥 Today's Deals</h2>

<br>

<p>
Fresh fashion at affordable prices.
</p>

</div>

</main>


<footer>

© 2026 VR SHOP

<br><br>

Your Local Fashion Store

</footer>


<!-- CART -->

<div
class="overlay"
id="cartPopup">

<div class="modal">

<button
class="close"
onclick="closeCart()">
×
</button>

<h2>🛒 Your Cart</h2>

<br>

<div id="cartItems"></div>

<div
class="total"
id="cartTotal">
</div>

<button
class="order"
onclick="openOrder()">

Proceed to Order

</button>

</div>
</div>


<!-- ORDER -->

<div
class="overlay"
id="orderPopup">

<div class="modal">

<button
class="close"
onclick="closeOrder()">
×
</button>

<h2>📦 Place Your Order</h2>

<br>

<div id="orderSummary"></div>


<div class="field">

<input
id="customerName"
placeholder="Full Name">

</div>


<div class="row">

<div class="field">

<input
id="customerPhone"
placeholder="10 Digit Mobile Number"
inputmode="numeric">

</div>

<div class="field">

<input
id="customerPin"
placeholder="Pincode"
inputmode="numeric">

</div>

</div>


<div class="field">

<textarea
id="customerAddress"
rows="3"
placeholder="Complete Delivery Address">
</textarea>

</div>


<div class="field">

<select id="customerDistance">

<option value="5">Within 5 KM</option>

<option value="10">Within 10 KM</option>

<option value="20">Within 20 KM</option>

<option value="50">Within 50 KM</option>

</select>

</div>


<button
class="order"
onclick="getLocation()">

📍 Share Current Location

</button>


<div
class="location"
id="locationStatus">

Location not shared yet.

</div>


<button
class="order"
onclick="sendWhatsAppOrder()">

💬 Send Order on WhatsApp

</button>

</div>
</div>


<script>

/* ============================================
   VR SHOP OWNER SETTINGS

   तुम्हारा WhatsApp नंबर:
   8099839245

   यहाँ country code 91 के साथ रखा गया है.
   ============================================ */

const OWNER_SETTINGS = {

  whatsappNumber: "918099839245",

  shopName: "VR SHOP"

};


/* PRODUCTS */

const products = [

{
id:1,
name:"Classic Men's Shirt",
category:"Men",
price:599,
oldPrice:899,
icon:"👔"
},

{
id:2,
name:"Men's Casual T-Shirt",
category:"Men",
price:399,
oldPrice:599,
icon:"👕"
},

{
id:3,
name:"Women's Fashion Dress",
category:"Women",
price:799,
oldPrice:1199,
icon:"👗"
},

{
id:4,
name:"Women's Top",
category:"Women",
price:449,
oldPrice:699,
icon:"👚"
},

{
id:5,
name:"Kids T-Shirt",
category:"Kids",
price:299,
oldPrice:449,
icon:"🧒"
},

{
id:6,
name:"Kids Party Dress",
category:"Kids",
price:699,
oldPrice:999,
icon:"🥻"
}

];


let cart = [];

let customerLocation = null;


/* SHOW PRODUCTS */

function showProducts(){

const search =
document.getElementById("search")
.value.toLowerCase();

const category =
document.getElementById("category")
.value;

const filtered =
products.filter(product => {

return (

(category === "All" ||
product.category === category)

&&

product.name
.toLowerCase()
.includes(search)

);

});


const container =
document.getElementById("products");

container.innerHTML = "";


filtered.forEach(product => {

container.innerHTML += `

<div class="product">

<div class="product-img">

${product.icon}

</div>

<div class="info">

<h3>
${product.name}
</h3>

<div class="category">
${product.category}
</div>

<div class="price">

₹${product.price}

<span class="old">
₹${product.oldPrice}
</span>

</div>

<button
class="add"
onclick="addToCart(${product.id})">

Add to Cart

</button>

</div>

</div>

`;

});

}


/* CATEGORY */

function selectCategory(category){

document.getElementById("category")
.value = category;

showProducts();

}


/* ADD CART */

function addToCart(id){

const existing =
cart.find(item => item.id === id);


if(existing){

existing.quantity++;

}else{

cart.push({

id:id,

quantity:1

});

}


updateCartCount();

alert("Product added to cart ✅");

}


/* CART COUNT */

function updateCartCount(){

let count =
cart.reduce(
(total,item) =>
total + item.quantity,
0
);

document.getElementById(
"cartCount"
).innerText = count;

}


/* OPEN CART */

function openCart(){

document.getElementById(
"cartPopup"
).style.display="block";

showCart();

}


function closeCart(){

document.getElementById(
"cartPopup"
).style.display="none";

}


/* SHOW CART */

function showCart(){

const container =
document.getElementById(
"cartItems"
);

if(cart.length === 0){

container.innerHTML =
"<p>Your cart is empty.</p>";

document.getElementById(
"cartTotal"
).innerText="";

return;

}


let total=0;

container.innerHTML="";


cart.forEach(item=>{

const product =
products.find(
p=>p.id===item.id
);

const itemTotal =
product.price *
item.quantity;

total += itemTotal;


container.innerHTML += `

<div
style="
padding:12px 0;
border-bottom:1px solid #ddd;
">

<b>
${product.name}
</b>

<br>

₹${product.price}
×
${item.quantity}

=
₹${itemTotal}

<br><br>

<button
onclick="removeFromCart(${product.id})">

Remove

</button>

</div>

`;

});


document.getElementById(
"cartTotal"
).innerText =
"Total: ₹"+total;

}


/* REMOVE */

function removeFromCart(id){

cart =
cart.filter(
item=>item.id!==id
);

updateCartCount();

showCart();

}


/* OPEN ORDER */

function openOrder(){

if(cart.length===0){

alert("Your cart is empty.");

return;

}


closeCart();


document.getElementById(
"orderPopup"
).style.display="block";


document.getElementById(
"customerDistance"
).value =
document.getElementById(
"deliveryRadius"
).value;


let total=0;


cart.forEach(item=>{

const product =
products.find(
p=>p.id===item.id
);

total +=
product.price *
item.quantity;

});


document.getElementById(
"orderSummary"
).innerHTML =

"<b>Order Total: ₹"+total+"</b>";

}


function closeOrder(){

document.getElementById(
"orderPopup"
).style.display="none";

}


/* LOCATION */

function getLocation(){

if(!navigator.geolocation){

alert(
"GPS is not supported."
);

return;

}


document.getElementById(
"locationStatus"
).innerText =
"Requesting location permission...";


navigator.geolocation.getCurrentPosition(

function(position){

customerLocation={

latitude:
position.coords.latitude,

longitude:
position.coords.longitude

};


document.getElementById(
"locationStatus"
).innerHTML=

"✅ Location captured<br>"+
"Latitude: "+
customerLocation.latitude.toFixed(6)+
"<br>Longitude: "+
customerLocation.longitude.toFixed(6);

},

function(){

document.getElementById(
"locationStatus"
).innerText =
"❌ Location permission denied.";

},

{

enableHighAccuracy:true

}

);

}


/* WHATSAPP ORDER */

function sendWhatsAppOrder(){

const name =
document.getElementById(
"customerName"
).value.trim();


const phone =
document.getElementById(
"customerPhone"
).value.trim();


const pin =
document.getElementById(
"customerPin"
).value.trim();


const address =
document.getElementById(
"customerAddress"
).value.trim();


const distance =
document.getElementById(
"customerDistance"
).value;


if(!name ||
!phone ||
!pin ||
!address){

alert(
"Please fill all customer details."
);

return;

}


if(!/^[0-9]{10}$/.test(phone)){

alert(
"Please enter valid 10 digit mobile number."
);

return;

}


if(!customerLocation){

alert(
"Please share your current location first."
);

return;

}


let total=0;

let items="";


cart.forEach(item=>{

const product =
products.find(
p=>p.id===item.id
);

const itemTotal =
product.price *
item.quantity;

total += itemTotal;


items +=

product.name+
" × "+
item.quantity+
" = ₹"+
itemTotal+
"\n";

});


const mapLink=

"https://maps.google.com/?q="+
customerLocation.latitude+
","+
customerLocation.longitude;


const message=

`VR SHOP 🛍️

NEW ORDER

━━━━━━━━━━━━━━

Customer:
${name}

Mobile:
${phone}

Pincode:
${pin}

Address:
${address}

Delivery Radius:
${distance} KM

━━━━━━━━━━━━━━

ORDER ITEMS

${items}

TOTAL:
₹${total}

━━━━━━━━━━━━━━

CUSTOMER CURRENT LOCATION:

${mapLink}

━━━━━━━━━━━━━━`;


const whatsappURL=

"https://wa.me/"+
OWNER_SETTINGS.whatsappNumber+
"?text="+
encodeURIComponent(message);


window.open(
whatsappURL,
"_blank"
);

}


/* START */

showProducts();

updateCartCount();

</script>

</body>
                        </html>
